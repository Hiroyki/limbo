name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Syntax
        run: for f in *.js ui/*.js tests/*.mjs; do node --check "$f"; done
      - name: Build
        run: python3 tools/build.py
      - name: Smoke test
        run: node tests/smoke.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: limbo
          path: store/*.zip
          if-no-files-found: error
